# MediaMTX สำหรับกล้องสดและอัดเก็บ (ใช้กับ compose.yaml)
# ทุกการเชื่อมต่อถามสิทธิ์จาก API ที่ POST /media/auth
logLevel: info

authMethod: http
authHTTPAddress: http://host.docker.internal:3001/media/auth
# ไม่ยกเว้นอะไร api/metrics/pprof ปิดอยู่แล้ว และ API ตอบไม่ผ่านเสมอ
authHTTPExclude: []

# ใช้แค่ RTSP (กล้องส่งเข้า) กับ WebRTC (หน้าเว็บดู)
rtmp: no
hls: no
srt: no

# ดูย้อนหลัง/ดาวน์โหลดผ่าน API เท่านั้น (compose ผูกพอร์ตนี้ไว้กับ 127.0.0.1)
playback: yes
playbackAddress: :9996

pathDefaults:
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  # เก็บ 30 วันแล้วลบเอง
  recordDeleteAfter: 30d

paths:
  # path ของกล้อง = cam/<id ในตาราง cameras>
  "~^cam/[0-9a-f-]{36}$": {}
