[project]
name = "classping-face"
version = "0.1.0"
description = "ClassPing face service: ตรวจและเทียบใบหน้าด้วย InsightFace"
authors = [
    { name = "Benz-Strb", email = "nd.natthawutbenz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "insightface==2.1",
    "numpy>=2.5.4",
    "onnxruntime==1.31.0",
    "opencv-python>=5.0.0.93",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model'"
markers = ["model: ใช้โมเดลจริง (โหลดครั้งแรกราว 300 MB)"]

[tool.ruff]
line-length = 100
