[project]
name = "classping-camera"
version = "0.1.0"
description = "ClassPing โปรแกรมกล้องหน้าห้อง: ถามคาบแล้วส่งภาพให้ API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "opencv-python>=5.0.0.93",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
