services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    # คิวภาพเก็บเฉพาะในหน่วยความจำ ไม่เขียนลงดิสก์ (ในงานคิวมีภาพเต็มห้อง และงานทิ้งได้)
    command: ["redis-server", "--appendonly", "no", "--save", ""]

  media:
    image: bluenviron/mediamtx:1.21.2
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8189:8189/udp"
      - "127.0.0.1:9996:9996"
      - "127.0.0.1:9997:9997"
    volumes:
      - ./services/media/mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"
