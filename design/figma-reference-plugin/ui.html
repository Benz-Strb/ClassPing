<!doctype html><meta charset="utf-8"><style>body{font:14px system-ui;background:#efefef;color:#000;padding:20px}pre{white-space:pre-wrap;font:12px system-ui}select,button{width:100%;padding:12px;margin:6px 0}</style><h2>ClassPing · SLCM</h2><p id="status">Applying DESIGN.md…</p><select id="screens"></select><button id="view">Inspect screen</button><pre id="report"></pre><script>onmessage=e=>{const m=e.data.pluginMessage;if(m.status)document.querySelector('#status').textContent=m.status;if(m.report){document.querySelector('#report').innerHTML='';for(const [key,value]of Object.entries(m.report)){if(key==='screens')continue;const row=document.createElement('p');row.textContent=key+': '+JSON.stringify(value);document.querySelector('#report').append(row);}for(const s of m.report.screens||[]){const o=document.createElement('option');o.value=s.id;o.textContent=s.name;document.querySelector('#screens').append(o);}}};document.querySelector('#view').onclick=()=>parent.postMessage({pluginMessage:{id:document.querySelector('#screens').value}},'*');</script>
