<!doctype html><html lang="th"><meta charset="utf-8"><title>ClassPing</title>
<style>body{margin:0;font:14px system-ui,sans-serif;background:#f6f7f3;color:#202923}header{padding:16px 20px;border-bottom:1px solid #d9e1d8}h1{font-size:18px;margin:0 0 8px}main{display:grid;grid-template-columns:240px 1fr;height:710px}aside{padding:12px;overflow:auto;background:#fff}button{display:block;text-align:left;border:1px solid #d9e1d8;border-radius:8px;background:#fff;padding:10px;margin-bottom:8px;width:100%;color:#285c4d;cursor:pointer}button.active{background:#e8f0ea}article{padding:16px;overflow:auto;text-align:center}img{max-width:100%;max-height:640px;object-fit:contain}pre{text-align:left;white-space:pre-wrap}p{margin:0;color:#617068}a{color:#285c4d}</style>
<header><h1>ClassPing · Pine & Peach</h1><p id="status">กำลังทำงาน…</p></header><main><aside id="list"></aside><article id="view"></article></main>
<script>
let previews=[],result;
function download(name,href){const a=document.createElement('a');a.download=name;a.href=href;a.click()}
function show(i){document.querySelectorAll('button[data-index]').forEach(b=>b.classList.toggle('active',Number(b.dataset.index)===i));const p=previews[i];const view=document.getElementById('view');view.replaceChildren();const img=document.createElement('img');img.src=p.image;img.alt=p.name;view.append(img);const focus=document.createElement('button');focus.textContent='เปิดหน้าจอนี้ใน Figma';focus.onclick=()=>parent.postMessage({pluginMessage:{type:'focus',id:p.id}},'*');view.append(focus);const save=document.createElement('button');save.textContent='บันทึกภาพตรวจ';save.onclick=()=>download('classping-'+p.id.replace(':','-')+'.png',p.image);view.append(save)}
onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='progress'||m.type==='error'){document.getElementById('status').textContent=m.message;return}if(m.type==='done'){previews=m.previews;result=m.result;document.getElementById('status').textContent='ปรับหน้าจอเดิมสำเร็จ · '+result.themedScreens+' หน้าจอเดิม · ออกแบบองค์ประกอบใหม่ 10 หน้าจอ · คงฟอนต์ Kanit';const list=document.getElementById('list');previews.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.name;b.dataset.index=i;b.onclick=()=>show(i);list.append(b)});const save=document.createElement('button');save.textContent='บันทึกรายงาน JSON';save.onclick=()=>download('classping-design-report.json','data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(result,null,2)));list.append(save);show(0)}};
</script></html>
