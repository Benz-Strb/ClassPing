<!doctype html><meta charset="utf-8">
<style>body{font:14px system-ui;color:#123f35;padding:20px}button,select{font:inherit;padding:10px;margin:4px 0;width:100%;border:1px solid #cbd7d0;border-radius:8px;background:#fff;color:#123f35}button{background:#176b58;color:white}pre{white-space:pre-wrap;font:12px system-ui}h2{margin-top:0}</style>
<h2>ClassPing UX</h2><p id="status">Building editable screens…</p>
<div id="tools" hidden><select id="screens"></select><button id="view">Inspect selected screen</button><button id="export">Export rendered QA ZIP</button></div><pre id="report"></pre>
<script>
const files=[];const enc=new TextEncoder();
const crcTable=Array.from({length:256},(_,i)=>{let c=i;for(let j=0;j<8;j++)c=c&1?0xedb88320^(c>>>1):c>>>1;return c>>>0;});
function crc(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0;}
function zip(entries){const chunks=[],central=[];let offset=0,size=0;for(const f of entries){const name=enc.encode(f.name),data=f.data;const c=crc(data);const header=new Uint8Array(30+name.length);const v=new DataView(header.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,c,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);header.set(name,30);chunks.push(header,data);const cd=new Uint8Array(46+name.length),d=new DataView(cd.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint32(16,c,true);d.setUint32(20,data.length,true);d.setUint32(24,data.length,true);d.setUint16(28,name.length,true);d.setUint32(42,offset,true);cd.set(name,46);central.push(cd);offset+=header.length+data.length;size+=cd.length;}const end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,size,true);e.setUint32(16,offset,true);return new Blob([...chunks,...central,end],{type:'application/zip'});}
onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.status)document.querySelector('#status').textContent=m.status;if(m.detail)document.querySelector('#report').textContent=m.detail;if(m.screens){document.querySelector('#tools').hidden=false;document.querySelector('#screens').innerHTML='';for(const s of m.screens){const o=document.createElement('option');o.value=s.id;o.textContent=s.name;document.querySelector('#screens').append(o);}}if(m.file)files.push({name:m.file.name,data:new Uint8Array(m.file.bytes)});if(m.done){files.push({name:'qa-report.json',data:enc.encode(m.detail)});const a=document.createElement('a');a.href=URL.createObjectURL(zip(files));a.download='classping-qa.zip';a.click();}};
document.querySelector('#view').onclick=()=>parent.postMessage({pluginMessage:{type:'inspect',id:document.querySelector('#screens').value}},'*');
document.querySelector('#export').onclick=()=>{files.length=0;parent.postMessage({pluginMessage:{type:'export'}},'*');};
</script>
